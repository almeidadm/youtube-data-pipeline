[project]
name = "youtube-data-pipeline"
version = "0.1.0"
description = "Biblioteca simplificada para coleta de dados da YouTube Data API v3"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Data Engineering Team" }]
dependencies = [
  "google-api-python-client>=2.156.0",
  "structlog>=24.4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.8.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["UP017"]
