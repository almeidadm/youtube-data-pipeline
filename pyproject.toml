[project]
name = "youtube-data-pipeline"
version = "0.1.0"
description = "Biblioteca simplificada para coleta de dados da YouTube Data API v3"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Data Engineering Team" }]
dependencies = [
  "google-api-python-client>=2.156.0",
  "ipykernel>=7.2.0",
  "matplotlib>=3.10.8",
  "matplotlib-venn>=1.1.2",
  "pandas>=3.0.2",
  "pyarrow>=23.0.1",
  "python-dotenv>=1.2.2",
  "scikit-learn>=1.5.0",
  "seaborn>=0.13.2",
  "structlog>=24.4.0",
  "upsetplot>=0.9.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.8.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["UP017"]
